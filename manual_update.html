<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Update | ARK ARCHIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;600&display=swap');
        
        :root { --cyan: #00BFFF; --pink: #FF1493; --black: #0a0a0a; --input-bg: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: white; margin: 0; display: flex; }

        /* Sidebar */
        .sidebar { width: 260px; background: #000; height: 100vh; padding: 30px 20px; position: fixed; border-right: 1px solid #333; }
        .sidebar h2 { font-family: 'Montserrat'; font-size: 18px; color: var(--cyan); margin-bottom: 40px; }
        .nav-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #666; font-size: 14px; }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-item.active { background: var(--pink); color: white; }

        /* Main Form Area */
        .main-content { margin-left: 260px; padding: 40px; width: 100%; max-width: 900px; }
        .section-card { background: #111; border: 1px solid #222; padding: 30px; border-radius: 15px; margin-bottom: 30px; }
        .section-card h3 { font-family: 'Montserrat'; font-size: 18px; margin-bottom: 25px; color: var(--cyan); display: flex; align-items: center; gap: 10px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        label { font-size: 12px; color: #888; text-transform: uppercase; font-weight: bold; }
        input { background: var(--input-bg); border: 1px solid #333; padding: 12px; border-radius: 8px; color: white; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0, 191, 255, 0.2); }

        .btn-update { background: var(--cyan); color: black; border: none; padding: 15px 30px; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 10px; text-transform: uppercase; }
        .btn-update:hover { transform: translateY(-3px); background: var(--pink); color: white; }

        .status-msg { margin-top: 15px; font-size: 13px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>ARK CONTROL</h2>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="manual_update.html" class="nav-item active"><i class="fas fa-edit"></i> Manual Update</a>
        <a href="index.html" class="nav-item" target="_blank"><i class="fas fa-external-link-alt"></i> View Website</a>
    </div>

    <div class="main-content">
        <h1 style="font-family:'Montserrat'; font-weight:900; margin-bottom:10px;">MISSION CONTROL</h1>
        <p style="color:#666; margin-bottom:40px;">Update live counters and publish new legacy plots.</p>

        <div class="section-card">
            <h3><i class="fas fa-chart-line"></i> Global Live Counters</h3>
            <div class="form-grid">
                <div class="input-group">
                    <label>Collected Amount ($)</label>
                    <input type="number" id="stats-money" placeholder="e.g. 5000">
                </div>
                <div class="input-group">
                    <label>Trees Bought</label>
                    <input type="number" id="stats-bought" placeholder="e.g. 1200">
                </div>
                <div class="input-group">
                    <label>Handed Over (Delivered)</label>
                    <input type="number" id="stats-delivered" placeholder="e.g. 850">
                </div>
            </div>
            <button class="btn-update" onclick="updateGlobalStats()">Update Live Website</button>
            <div id="stat-msg" class="status-msg" style="color: var(--cyan);">Counters Updated Successfully!</div>
        </div>

        <div class="section-card">
            <h3><i class="fas fa-plus-circle"></i> Publish New Plot (Manual)</h3>
            <div class="form-grid">
                <div class="input-group">
                    <label>Donor Full Name</label>
                    <input type="text" id="plot-name" placeholder="Kawsar Ahmed">
                </div>
                <div class="input-group">
                    <label>Tree Quantity</label>
                    <input type="number" id="plot-qty" placeholder="100">
                </div>
                <div class="input-group" style="grid-column: span 2;">
                    <label>Donor Image URL (Direct Link)</label>
                    <input type="text" id="plot-img" placeholder="https://example.com/photo.jpg">
                </div>
                <div class="input-group" style="grid-column: span 2;">
                    <label>Social Link / Website (Optional)</label>
                    <input type="text" id="plot-social" placeholder="https://facebook.com/username">
                </div>
            </div>
            <button class="btn-update" style="background: var(--pink); color: white;" onclick="publishPlot()">Publish to Legacy Grid</button>
            <div id="plot-msg" class="status-msg" style="color: var(--pink);">New Plot is now Live!</div>
        </div>
    </div>

    <script type="module">
        import { db, ref, update, push, set, serverTimestamp } from './firebase-config.js';

        // Update Live Counters
        window.updateGlobalStats = function() {
            const money = document.getElementById('stats-money').value;
            const bought = document.getElementById('stats-bought').value;
            const delivered = document.getElementById('stats-delivered').value;

            if(!money || !bought || !delivered) return alert("Please fill all stats!");

            update(ref(db, 'liveStats'), {
                collected: money,
                bought: bought,
                delivered: delivered
            }).then(() => {
                showMsg('stat-msg');
            }).catch(err => alert("Error: " + err));
        }

        // Publish New Plot
        window.publishPlot = function() {
            const name = document.getElementById('plot-name').value;
            const qty = document.getElementById('plot-qty').value;
            const img = document.getElementById('plot-img').value;
            const social = document.getElementById('plot-social').value;

            if(!name || !qty || !img) return alert("Name, Qty and Image are required!");

            const newPlotRef = push(ref(db, 'publishedPlots'));
            set(newPlotRef, {
                name: name,
                qty: qty,
                image: img,
                social: social || "#",
                timestamp: serverTimestamp()
            }).then(() => {
                showMsg('plot-msg');
                // Clear fields
                document.getElementById('plot-name').value = "";
                document.getElementById('plot-qty').value = "";
                document.getElementById('plot-img').value = "";
            });
        }

        function showMsg(id) {
            const el = document.getElementById(id);
            el.style.display = "block";
            setTimeout(() => { el.style.display = "none"; }, 3000);
        }
    </script>
</body>
</html>
