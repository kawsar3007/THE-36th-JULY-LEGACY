<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARK ADMIN | Mission Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;600&display=swap');
        
        :root { --cyan: #00BFFF; --pink: #FF1493; --black: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; display: flex; }

        /* Sidebar Design */
        .sidebar { width: 260px; background: var(--black); height: 100vh; color: white; padding: 30px 20px; position: fixed; }
        .sidebar h2 { font-family: 'Montserrat'; font-size: 20px; color: var(--cyan); margin-bottom: 40px; }
        .nav-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 10px; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: var(--pink); color: white; }

        /* Main Content */
        .main-content { margin-left: 260px; padding: 40px; width: 100%; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card h3 { font-family: 'Montserrat'; margin-bottom: 20px; font-size: 18px; border-left: 4px solid var(--cyan); padding-left: 10px; }

        .input-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px; }
        input:focus { border-color: var(--cyan); }
        
        button { padding: 12px 25px; background: var(--cyan); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.3s; }
        button:hover { background: var(--pink); transform: translateY(-2px); }

        /* Table Style */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8f9fa; padding: 12px; font-size: 13px; text-transform: uppercase; color: #666; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; background: #e1f5fe; color: #01579b; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>ARK ARCHIVE</h2>
        <div class="nav-item active"><i class="fas fa-chart-line"></i> Dashboard</div>
        <div class="nav-item"><i class="fas fa-history"></i> Order History</div>
        <div class="nav-item"><i class="fas fa-cog"></i> Settings</div>
    </div>

    <div class="main-content">
        <div class="card">
            <h3>Manual Update (Live Stats)</h3>
            <div class="input-group">
                <input type="number" id="stats-collected" placeholder="Collected Amount ($)">
                <input type="number" id="stats-bought" placeholder="Trees Bought">
                <input type="number" id="stats-delivered" placeholder="Handed Over">
            </div>
            <button onclick="updateStats()">Update Public Counters</button>
        </div>

        <div class="card">
            <h3>Manual Plot Upload (Customer Info)</h3>
            <div class="input-group">
                <input type="text" id="plot-name" placeholder="Donor Full Name">
                <input type="text" id="plot-image" placeholder="Image URL (Direct Link)">
                <input type="text" id="plot-social" placeholder="Social Media/Website Link">
                <input type="number" id="plot-qty" placeholder="Trees Donated">
            </div>
            <button onclick="uploadPlot()" style="background: var(--pink);">Publish to Grid</button>
        </div>

        <div class="card">
            <h3>Recent Donation Requests</h3>
            <table>
                <thead>
                    <tr>
                        <th>Donor Name</th>
                        <th>Trees</th>
                        <th>Status</th>
                        <th>Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="request-table">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, update, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCAdnfu2R82xbC7H85n_9mvQBE58X3TjbA",
            authDomain: "the-5k-elite-legacy.firebaseapp.com",
            databaseURL: "https://the-5k-elite-legacy-default-rtdb.firebaseio.com",
            projectId: "the-5k-elite-legacy",
            storageBucket: "the-5k-elite-legacy.firebasestorage.app",
            messagingSenderId: "440824313752",
            appId: "1:440824313752:web:2c93344dcfe2ba0a4c5ded",
            measurementId: "G-6KEYY60YGG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. Update Live Stats
        window.updateStats = function() {
            const collected = document.getElementById('stats-collected').value;
            const bought = document.getElementById('stats-bought').value;
            const delivered = document.getElementById('stats-delivered').value;

            if(!collected || !bought || !delivered) return alert("Fill all stats!");

            update(ref(db, 'liveStats'), {
                collected: collected,
                bought: bought,
                delivered: delivered
            }).then(() => alert("Stats Updated Live!"));
        }

        // 2. Upload Manual Plot
        window.uploadPlot = function() {
            const name = document.getElementById('plot-name').value;
            const img = document.getElementById('plot-image').value;
            const link = document.getElementById('plot-social').value;
            const qty = document.getElementById('plot-qty').value;

            if(!name || !img) return alert("Name and Image are required!");

            const newPlotRef = push(ref(db, 'publishedPlots'));
            set(newPlotRef, {
                name: name,
                image: img,
                social: link,
                qty: qty,
                timestamp: Date.now()
            }).then(() => {
                alert("Plot is now LIVE on the website!");
                document.querySelectorAll('.input-group input').forEach(i => i.value = "");
            });
        }

        // 3. Load Donation Requests
        onValue(ref(db, 'donationRequests'), (snapshot) => {
            const table = document.getElementById('request-table');
            table.innerHTML = "";
            const data = snapshot.val();
            for (let id in data) {
                const req = data[id];
                table.innerHTML += `
                    <tr>
                        <td><strong>${req.name}</strong></td>
                        <td>${req.treeQty} Trees</td>
                        <td><span class="status-badge">Pending</span></td>
                        <td>${new Date(req.timestamp).toLocaleDateString()}</td>
                        <td><button onclick="copyInfo('${req.name}', ${req.treeQty})" style="padding:5px 10px; font-size:11px;">Copy</button></td>
                    </tr>
                `;
            }
        });

        window.copyInfo = (name, qty) => {
            document.getElementById('plot-name').value = name;
            document.getElementById('plot-qty').value = qty;
            alert("Name and Quantity copied to Uploader!");
        }
    </script>
</body>
</html>
