<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARK DASHBOARD | Analytics & Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;600&display=swap');
        
        :root { --cyan: #00BFFF; --pink: #FF1493; --black: #0f0f0f; --card-bg: #1a1a1a; }
        
        body { font-family: 'Inter', sans-serif; background: var(--black); color: white; margin: 0; display: flex; }

        /* Sidebar Style */
        .sidebar { width: 260px; background: #000; height: 100vh; padding: 30px 20px; position: fixed; border-right: 1px solid #333; }
        .sidebar h2 { font-family: 'Montserrat'; font-size: 20px; color: var(--cyan); margin-bottom: 40px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-item { padding: 15px; cursor: pointer; border-radius: 8px; margin-bottom: 10px; transition: 0.3s; display: flex; align-items: center; gap: 10px; text-decoration: none; color: #888; font-weight: 600; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--pink); color: white; }

        /* Main Content */
        .main-container { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: 15px; border-left: 5px solid var(--cyan); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .stat-card h4 { font-size: 11px; color: #888; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
        .stat-card .value { font-size: 32px; font-weight: 900; font-family: 'Montserrat'; margin-top: 10px; color: var(--white); }
        .stat-card i { float: right; font-size: 24px; opacity: 0.2; }

        /* Layout Grid */
        .dashboard-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }
        .panel { background: #000; border: 1px solid #333; border-radius: 15px; padding: 25px; }
        .panel h3 { font-family: 'Montserrat'; font-size: 16px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; color: var(--cyan); }

        /* Plot visualizer */
        .plot-grid-mini { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
        .p-dot { aspect-ratio: 1; background: #222; border-radius: 2px; font-size: 7px; display: flex; align-items: center; justify-content: center; }
        .p-dot.filled { background: var(--cyan); color: #000; font-weight: bold; }

        /* History Table */
        .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .history-table th { text-align: left; color: #555; padding-bottom: 10px; border-bottom: 1px solid #222; }
        .history-table td { padding: 12px 0; border-bottom: 1px solid #111; }
        .status-pill { padding: 2px 8px; border-radius: 4px; font-size: 10px; background: #1a3a3a; color: var(--cyan); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>ARK ARCHIVE</h2>
        <a href="dashboard.html" class="nav-item active"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="admin.html" class="nav-item"><i class="fas fa-edit"></i> Manual Update</a>
        <a href="order.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Requests</a>
        <a href="index.html" class="nav-item" target="_blank"><i class="fas fa-external-link-alt"></i> Live Site</a>
    </div>

    <div class="main-container">
        <div class="header-flex">
            <div>
                <h1 style="font-family:'Montserrat'; margin:0;">System Overview</h1>
                <p style="color:#666; font-size: 14px;">Real-time node monitoring & legacy tracking</p>
            </div>
            <div id="sync-status" style="color: #00ff00; font-size: 12px; font-weight: bold;">
                <i class="fas fa-sync-alt fa-spin"></i> SYSTEM LIVE
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-dollar-sign"></i>
                <h4>Collected</h4>
                <div class="value" id="dash-money">$0</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-tree"></i>
                <h4>Trees Bought</h4>
                <div class="value" id="dash-bought">0</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-truck"></i>
                <h4>Handed Over</h4>
                <div class="value" id="dash-delivered">0</div>
            </div>
            <div class="stat-card" style="border-left-color: var(--pink);">
                <i class="fas fa-users"></i>
                <h4>Plots Occupied</h4>
                <div class="value" id="dash-plots">0/100</div>
            </div>
        </div>

        <div class="dashboard-layout">
            <div class="panel">
                <h3>Plot Allocation Map (100 Nodes)</h3>
                <div class="plot-grid-mini" id="visualGrid">
                    </div>
                <div style="margin-top: 20px; display: flex; gap: 20px; font-size: 12px;">
                    <span><i class="fas fa-square" style="color: var(--cyan);"></i> Live Plot</span>
                    <span><i class="fas fa-square" style="color: #222;"></i> Available</span>
                </div>
            </div>

            <div class="panel">
                <h3>Live Feed / History</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Donor</th>
                            <th>Qty</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, ref, onValue } from './firebase-config.js';

        // 1. Live Stats Sync
        onValue(ref(db, 'liveStats'), (snapshot) => {
            const data = snapshot.val() || { collected: 0, bought: 0, delivered: 0 };
            document.getElementById('dash-money').innerText = '$' + data.collected;
            document.getElementById('dash-bought').innerText = data.bought;
            document.getElementById('dash-delivered').innerText = data.delivered;
        });

        // 2. Plot Inventory & History Sync
        onValue(ref(db, 'publishedPlots'), (snapshot) => {
            const plots = snapshot.val() || {};
            const plotEntries = Object.values(plots);
            const count = plotEntries.length;
            
            // Update counts
            document.getElementById('dash-plots').innerText = `${count}/100`;

            // Update Visual Grid
            const grid = document.getElementById('visualGrid');
            grid.innerHTML = "";
            for(let i=1; i<=100; i++) {
                const isFilled = i <= count ? 'filled' : '';
                grid.innerHTML += `<div class="p-dot ${isFilled}">${i}</div>`;
            }

            // Update History Table
            const historyBody = document.getElementById('historyBody');
            historyBody.innerHTML = "";
            plotEntries.reverse().slice(0, 10).forEach(p => {
                historyBody.innerHTML += `
                    <tr>
                        <td><b>${p.name}</b></td>
                        <td>${p.qty}</td>
                        <td><span class="status-pill">PUBLISHED</span></td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
