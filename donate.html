<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate | ARK ARCHIVE Legacy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Inter:wght@400;600&display=swap');
        
        :root { --cyan: #00BFFF; --pink: #FF1493; --black: #050505; }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .order-container { width: 100%; max-width: 450px; padding: 40px; background: #111; border: 1px solid #222; border-radius: 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .logo { font-family: 'Montserrat'; font-weight: 900; color: var(--cyan); font-size: 24px; margin-bottom: 10px; }
        h2 { font-family: 'Montserrat'; font-size: 18px; margin-bottom: 30px; letter-spacing: 1px; }

        .input-box { width: 100%; margin-bottom: 20px; text-align: left; }
        label { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: bold; }
        input { width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: white; outline: none; box-sizing: border-box; }
        input:focus { border-color: var(--cyan); }

        .submit-btn { width: 100%; padding: 18px; background: var(--pink); border: none; border-radius: 10px; color: white; font-weight: 900; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 14px; }
        .submit-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255, 20, 147, 0.4); }

        /* Payment Methods */
        #payment-section { display: none; margin-top: 30px; border-top: 1px solid #222; padding-top: 20px; animation: fadeIn 0.5s ease; }
        .pay-card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .pay-card:hover { border-color: var(--cyan); }
        .pay-card h4 { margin: 0; font-size: 14px; }
        .pay-card span { font-size: 10px; background: var(--cyan); color: black; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="order-container">
        <div class="logo">ARK ARCHIVE</div>
        <h2>JOIN THE LEGACY MISSION</h2>

        <div id="form-section">
            <div class="input-box">
                <label>Donor Full Name</label>
                <input type="text" id="order-name" placeholder="Enter your name">
            </div>
            <div class="input-box">
                <label>Number of Trees ($1/Tree)</label>
                <input type="number" id="order-qty" placeholder="Minimum 1">
            </div>
            <button class="submit-btn" onclick="submitDonation()">Submit & Pay</button>
        </div>

        <div id="payment-section">
            <h3 style="color: var(--cyan); font-size: 16px;">Step 2: Complete Payment</h3>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 20px;">Click to copy the address and send payment.</p>
            
            <div class="pay-card" onclick="copyText('01756206213')">
                <h4>bKash: 01756206213</h4>
                <span>PERSONAL</span>
            </div>
            <div class="pay-card" onclick="copyText('TTapBkTqrDnzHbWzek6wSBUTcJKFmR8Ws6')">
                <h4>USDT (TRC20)</h4>
                <span>GLOBAL</span>
            </div>
            <div class="pay-card" onclick="copyText('912221034')">
                <h4>Binance UID: 912221034</h4>
                <span>WEB3</span>
            </div>

            <p style="font-size: 11px; margin-top: 20px; color: #666;">After payment, send your Photo & Screenshot to <a href="https://wa.me/8801576940717" style="color: var(--cyan);">WhatsApp Support</a>.</p>
        </div>
    </div>

    <script type="module">
        import { db, ref, push, set, serverTimestamp } from './firebase-config.js';

        window.submitDonation = function() {
            const name = document.getElementById('order-name').value;
            const qty = document.getElementById('order-qty').value;

            if(!name || !qty) return alert("Please fill your details!");

            // ফায়ারবেসে রিকোয়েস্ট পাঠানো
            const requestRef = push(ref(db, 'donationRequests'));
            set(requestRef, {
                name: name,
                treeQty: qty,
                timestamp: serverTimestamp(),
                status: 'pending'
            }).then(() => {
                // ফর্ম হাইড করে পেমেন্ট সেকশন দেখানো
                document.getElementById('form-section').style.display = 'none';
                document.getElementById('payment-section').style.display = 'block';
            }).catch(err => alert("Error: " + err));
        }

        window.copyText = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Address Copied: " + text);
            });
        }
    </script>
</body>
</html>
